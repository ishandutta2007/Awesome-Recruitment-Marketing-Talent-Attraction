<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#090d16; border-radius:12px; font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; overflow:hidden;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.0" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" fill="url(#bg-grad)" />

  <!-- Animated Glowing Background Nodes (Behind Title) -->
  <g opacity="0.6">
    <circle cx="150" cy="80" r="120" fill="url(#glow-grad)" filter="url(#glow)">
      <animate attributeName="cx" values="150;200;150" dur="10s" repeatCount="indefinite" />
      <animate attributeName="cy" values="80;120;80" dur="8s" repeatCount="indefinite" />
    </circle>
    <circle cx="1050" cy="260" r="140" fill="url(#glow-grad)" filter="url(#glow)">
      <animate attributeName="cx" values="1050;980;1050" dur="12s" repeatCount="indefinite" />
      <animate attributeName="cy" values="260;220;260" dur="9s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Geometric Grid Pattern (Subtle) -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="200" y1="0" x2="200" y2="360" />
    <line x1="400" y1="0" x2="400" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="800" y1="0" x2="800" y2="360" />
    <line x1="1000" y1="0" x2="1000" y2="360" />
  </g>

  <!-- Dynamic Network Pipeline Graphic (Bottom flow) -->
  <g opacity="0.4">
    <!-- Connecting flow lines -->
    <path d="M 100 290 Q 300 320 600 290 T 1100 300" fill="none" stroke="url(#primary-grad)" stroke-width="2" stroke-dasharray="8,6">
      <animate attributeName="stroke-dashoffset" values="0;-100" dur="12s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Dynamic Interactive Floating Badges / Metrics Cards (Well below title to avoid overlap) -->
  <!-- Card 1: Talent CRM -->
  <g transform="translate(100, 260)">
    <rect width="180" height="48" rx="8" fill="url(#card-grad)" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.2">
      <animate attributeName="stroke-opacity" values="0.3;0.8;0.3" dur="4s" repeatCount="indefinite" />
    </rect>
    <circle cx="24" cy="24" r="6" fill="#38bdf8">
      <animate attributeName="r" values="5;7;5" dur="3s" repeatCount="indefinite" />
    </circle>
    <text x="40" y="29" fill="#e2e8f0" font-size="14" font-weight="600" letter-spacing="0.5">Talent CRM</text>
  </g>

  <!-- Card 2: Recruitment Marketing -->
  <g transform="translate(360, 260)">
    <rect width="220" height="48" rx="8" fill="url(#card-grad)" stroke="#818cf8" stroke-opacity="0.4" stroke-width="1.2">
      <animate attributeName="stroke-opacity" values="0.4;0.9;0.4" dur="4.5s" repeatCount="indefinite" />
    </rect>
    <circle cx="24" cy="24" r="6" fill="#818cf8">
      <animate attributeName="r" values="5;7;5" dur="3.5s" repeatCount="indefinite" />
    </circle>
    <text x="40" y="29" fill="#e2e8f0" font-size="14" font-weight="600" letter-spacing="0.5">Employer Branding</text>
  </g>

  <!-- Card 3: AI Sourcing & Outreach -->
  <g transform="translate(660, 260)">
    <rect width="210" height="48" rx="8" fill="url(#card-grad)" stroke="#a855f7" stroke-opacity="0.4" stroke-width="1.2">
      <animate attributeName="stroke-opacity" values="0.3;0.85;0.3" dur="5s" repeatCount="indefinite" />
    </rect>
    <circle cx="24" cy="24" r="6" fill="#a855f7">
      <animate attributeName="r" values="5;7;5" dur="4s" repeatCount="indefinite" />
    </circle>
    <text x="40" y="29" fill="#e2e8f0" font-size="14" font-weight="600" letter-spacing="0.5">Autonomous Sourcing</text>
  </g>

  <!-- Card 4: Open Source + SaaS -->
  <g transform="translate(940, 260)">
    <rect width="180" height="48" rx="8" fill="url(#card-grad)" stroke="#ec4899" stroke-opacity="0.4" stroke-width="1.2">
      <animate attributeName="stroke-opacity" values="0.4;0.9;0.4" dur="3.8s" repeatCount="indefinite" />
    </rect>
    <circle cx="24" cy="24" r="6" fill="#ec4899">
      <animate attributeName="r" values="5;7;5" dur="3s" repeatCount="indefinite" />
    </circle>
    <text x="40" y="29" fill="#e2e8f0" font-size="14" font-weight="600" letter-spacing="0.5">ATS &amp; Pipelines</text>
  </g>

  <!-- FOREGROUND: TITLE & SUBTITLE (Always crisp & on top) -->
  <g>
    <!-- Category Pill Badge -->
    <rect x="440" y="45" width="320" height="30" rx="15" fill="#38bdf8" fill-opacity="0.12" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1" />
    <text x="600" y="65" fill="#38bdf8" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1.5">TALENT ACQUISITION &amp; RECRUITMENT TECH</text>

    <!-- Main Title with Gradient Fill -->
    <text x="600" y="132" fill="url(#primary-grad)" font-size="40" font-weight="800" text-anchor="middle" letter-spacing="-0.5">
      Recruitment Marketing &amp; Talent Attraction
    </text>

    <!-- Subtitle -->
    <text x="600" y="175" fill="#94a3b8" font-size="17" font-weight="400" text-anchor="middle">
      Curated Catalog of Enterprise Talent CRMs, Career Platforms, Sourcing Agents &amp; Open-Source ATS
    </text>

    <!-- Highlights Line -->
    <text x="600" y="210" fill="#64748b" font-size="13" font-weight="500" text-anchor="middle" letter-spacing="0.8">
      SaaS BENCHMARKS • VERIFIED PRICING • VALUATIONS • OPEN-SOURCE ALTERNATIVES
    </text>
  </g>
</svg>
